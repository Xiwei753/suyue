name: Watch Lite HAP build (self-hosted DevEco required)
# 源码检查（pagination-test.yml）不等于 HAP 构建。本 workflow 必须运行在
# 已安装 Lite Wearable DevEco 工具链的自托管 runner 上；GitHub-hosted
# ubuntu-latest 没有 hvigor 与 Lite SDK，会直接失败。
#
# 签名材料（secrets.WATCH_SIGNING_MATERIAL，JSON）：
#   storeFileB64/certpathB64/profileB64: base64 编码的签名文件
#   keyAlias/keyPassword/storePassword: 口令
#   signAlg: 默认 SHA256withECDSA
#   fingerprints: {"phone": 64位hex, "watch": 64位hex}
#   —— 手机证书指纹注入手表侧 PhonePeerConfig.g.js，
#     用于门控消息来源。材料只在构建生命周期内
#     存在，结束步骤（if: always()）统一清理。
on:
  push:
    branches: [auto-issue-1, main]
    paths:
      - 'apps/watch/**'
      - 'tools/build_watch_lite.sh'
      - 'tools/inject_signing.py'
      - 'tests/build_artifact_check.sh'
      - '.github/workflows/watch_lite_hap.yml'
  workflow_dispatch:

jobs:
  watch-lite-hap:
    runs-on: [self-hosted, hmos-deveco]
    steps:
      - uses: actions/checkout@v4

      - name: Verify signing material is present
        env:
          WATCH_SIGNING_MATERIAL: ${{ secrets.WATCH_SIGNING_MATERIAL }}
        run: |
          if [ -z "$WATCH_SIGNING_MATERIAL" ]; then
            echo "ERROR: 签名材料缺失（secrets.WATCH_SIGNING_MATERIAL 未配置）。" >&2
            echo "未签名构建不能标记为成功；请先配置 GT4 Lite 签名材料。" >&2
            exit 1
          fi

      - name: Stage signing material and signingConfigs
        # 材料写入 $RUNNER_TEMP（跨 step 持久），
        # 不在本 step 末尾删除（旧实现的 trap
        # 会在本 step 结束时删掉材料，导致
        # 构建 step 读不到——施工单 P1-7）。
        env:
          WATCH_SIGNING_MATERIAL: ${{ secrets.WATCH_SIGNING_MATERIAL }}
        run: |
          python3 tools/inject_signing.py \
            --material-json "$WATCH_SIGNING_MATERIAL" \
            --signing-dir "$RUNNER_TEMP/suyue-signing" \
            --build-profile apps/watch/build-profile.json5 \
            --identity-file apps/watch/entry/src/main/js/MainAbility/wear/PhonePeerConfig.g.js \
            --identity-var INJECTED_PHONE_FINGERPRINT \
            --fingerprint-key phone

      - name: Build Lite Wearable HAP
        run: tools/build_watch_lite.sh release

      - name: Locate HAP
        id: hap
        run: |
          HAP="$(find apps/watch/entry/build/default/outputs/default -name 'entry-default-release-*.hap' -type f | head -n 1)"
          if [ -z "$HAP" ]; then
            echo "ERROR: release HAP not found" >&2
            exit 1
          fi
          echo "path=$HAP" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$HAP")" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$HAP")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$HAP" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Report artifact identity
        run: |
          echo "HAP name: ${{ steps.hap.outputs.name }}"
          echo "HAP size: ${{ steps.hap.outputs.size }} bytes"
          echo "HAP sha256: ${{ steps.hap.outputs.sha256 }}"

      - name: Upload Lite HAP only
        uses: actions/upload-artifact@v4
        with:
          name: suyue-watch-lite-hap
          path: ${{ steps.hap.outputs.path }}
          if-no-files-found: error

      - name: Remove signing material and restore configs
        # 无论构建成败都执行：签名材料
        # 不得残留在工作区（施工单 P1-7）。
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/suyue-signing"
          git checkout -- apps/watch/build-profile.json5 \
            apps/watch/entry/src/main/js/MainAbility/wear/PhonePeerConfig.g.js
          echo "signing material removed; configs restored"
