name: Source-only checks (not HAP build)
on:
  push:
    paths:
      - 'apps/watch/**'
      - 'apps/phone/**'
      - 'tests/**'
      - 'README.md'
      - 'docs/BUILD_AND_TRANSFER.md'
      - '.github/workflows/pagination-test.yml'
  pull_request:
  workflow_dispatch:
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check project layout
        run: node tests/source-contract.test.mjs
      - name: Test UTF-8 paging
        run: node --experimental-default-type=module tests/pagination.test.mjs
      - name: Test zip inflate / EPUB unpack guards
        run: node --experimental-default-type=module tests/zip_inflate.test.mjs
      - name: Test transfer protocol
        run: node --experimental-default-type=module tests/protocol.test.mjs
      - name: Test pure-JS SHA-256
        run: node --experimental-default-type=module tests/sha256.test.mjs
      - name: Test watch Utf8/Base64 utils
        run: node --experimental-default-type=module tests/watch_utils.test.mjs
      - name: Test watch transfer receiver logic
        run: node --experimental-default-type=module tests/transfer_logic.test.mjs
