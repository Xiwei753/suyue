name: Reader pagination unit test
on:
  push:
    paths:
      - 'apps/watch/entry/src/main/js/MainAbility/reader/**'
      - 'tests/**'
      - '.github/workflows/pagination-test.yml'
  pull_request:
  workflow_dispatch:
jobs:
  pagination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module tests/pagination.test.mjs
